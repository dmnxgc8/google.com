<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=https://google.com" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting to Google</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f7f7f7;
        color: #222;
      }
      .card {
        text-align: center;
        padding: 2rem 3rem;
        border-radius: 12px;
        background: white;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      }
      a {
        color: #1a73e8;
        text-decoration: none;
      }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Redirecting to Google...</h1>
      <p>If you are not redirected automatically, <a href="https://google.com">click here</a>.</p>
    </div>
  </body>
</html>
